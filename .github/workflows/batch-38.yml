name: Batch 38 - Admin Categories (FluentPDO → ExtendedPdo)

on:
  workflow_dispatch:

jobs:
  apply-batch-38:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-38-admin-categories-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Run Batch 38 transformer
        run: |
          php ./tools/batch-38-apply.php

      - name: Detect changes
        id: changes
        run: |
          set -e
          git diff --name-only > /tmp/changed.txt || true
          if [ -s /tmp/changed.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          git diff > batch-38.diff || true

      - name: Create branch, commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m "batch38(admin): migrate admin categories & peers snippets from FluentPDO to ExtendedPdo; remove Literal import"
          git push --set-upstream origin "$UNIQUE_BRANCH"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.UNIQUE_BRANCH }}
          title: "Batch 38: Admin • Categories migration (FluentPDO → ExtendedPdo)"
          body: |
            This PR was created by the Batch 38 action. It removes FluentPDO usage in admin category flows,
            updates queries to ExtendedPdo, removes `Envms\FluentPDO\Literal`, and hardens guards.
          labels: batch, automated, admin
          delete-branch: true

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-38-diff
          path: batch-38.diff
