name: Composer Modernization

on:
  workflow_dispatch:
    inputs:
      update_lock:
        description: "Attempt 'composer update' and open PR if successful"
        required: false
        default: "false"
  pull_request:
    branches: [ main, develop ]

jobs:
  diagnose:
    name: Diagnose (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Composer validate
        continue-on-error: true
        run: composer validate --no-check-publish --strict

      - name: Outdated (direct deps)
        continue-on-error: true
        run: composer outdated --direct --format=json > composer-outdated.json || true

      - name: Why-not PHP ^8.3
        continue-on-error: true
        run: composer why-not php ^8.3 -t > composer-why-not-php83.txt || true

      - name: Why-not Laravel 11 (if constrained)
        continue-on-error: true
        run: composer why-not laravel/framework ^11.0 -t > composer-why-not-laravel11.txt || true

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: composer-diagnosis
          path: |
            composer.json
            composer.lock
            composer-outdated.json
            composer-why-not-php83.txt
            composer-why-not-laravel11.txt

  update:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_lock == 'true' }}
    name: Update (attempt lock refresh)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Composer update (no scripts/plugins)
        id: update
        continue-on-error: true
        run: |
          composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies             --no-scripts --no-plugins || echo "UPDATE_FAILED=1" >> $GITHUB_ENV

      - name: Save update logs
        run: |
          composer outdated --direct --format=json > composer-outdated-post.json || true
          echo "Update status: ${{ env.UPDATE_FAILED || '0' }}" > composer-update-status.txt

      - name: Create PR with lockfile and reports (if update succeeded)
        if: ${{ env.UPDATE_FAILED != '1' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(composer): update lockfile for PHP 8.3 compatibility"
          title: "Composer lock update (automated)"
          body: |
            This PR was created by the Composer Modernization workflow.

            - PHP: 8.3
            - Performed: `composer update --with-all-dependencies --no-scripts --no-plugins`
            - See attached artifacts for diagnosis before/after.
          branch: ci/composer-lock-update
          delete-branch: true
          add-paths: |
            composer.lock
            composer-outdated-post.json
            composer-update-status.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: composer-update-output
          path: |
            composer.lock
            composer-outdated-post.json
            composer-update-status.txt
