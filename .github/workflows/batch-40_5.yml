name: Batch 40.5 - Full Repo FluentPDO Sweep (Simple PR)

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-40-5-fluentpdo-sweep-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Run sweep
        run: php ./tools/batch-40_5-sweep.php

      - name: Create branch, commit and push
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m "batch40.5(sweep): add FluentPDO report (and conservative fixes where applicable)" || echo "Nothing to commit"
          git push --set-upstream origin "$UNIQUE_BRANCH" || echo "Nothing to push"

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.UNIQUE_BRANCH }}
          title: "Batch 40.5: Repo-wide FluentPDO sweep (simple PR)"
          body: |
            This PR contains:
            - Repo-wide FluentPDO usage report in `tools/reports/`
            - Conservative safe replacements (imports/docblocks/obvious admin patterns)
            Review and merge when ready.
          labels: batch, automated, sweep
          delete-branch: true
