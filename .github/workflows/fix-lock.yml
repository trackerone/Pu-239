name: Fix Composer Lock (no version bump)
on:
  workflow_dispatch:

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: >
            bz2, ctype, curl, dom, exif, fileinfo, gd, gettext,
            iconv, imagick, intl, json, libxml, mbstring, mysqli,
            pcntl, pdo, posix, readline, simplexml, sockets, xml,
            opcache, zip, zlib

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install (no scripts)
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Refresh lockfile only
        run: composer update --lock --no-interaction --no-progress

      - name: Commit lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(composer): refresh composer.lock (no version bump)"
          branch: composer/fix-lock

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: composer/fix-lock
          title: "chore: Refresh composer.lock (no version bump)"
          body: "Automated lock refresh to keep metadata current."
          commit-message: "chore(composer): refresh composer.lock"
          delete-branch: true
