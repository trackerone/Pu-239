name: Batch 40 - FluentPDO Sweep (classic)

on:
  workflow_dispatch:

jobs:
  run-batch-40:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-40-fluentpdo-classic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Apply Batch 40 (classic)
        run: php ./tools/batch-40-apply.php

      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m "batch40(classic): repo-wide FluentPDO report + conservative fixes" || echo "Nothing to commit"
          git push --set-upstream origin "$UNIQUE_BRANCH" || echo "Nothing to push"

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.UNIQUE_BRANCH }}
          title: "Batch 40 (classic): Full repo FluentPDO sweep"
          body: |
            Classic-style batch: minimal steps, no artifacts.
            - Writes reports to tools/reports/
            - Applies conservative fixes where safe
          labels: batch, automated, sweep
          delete-branch: true
