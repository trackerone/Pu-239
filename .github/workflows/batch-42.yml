name: Batch 42 - FluentPDO Mapping (API PR)

on:
  workflow_dispatch:

jobs:
  run-batch-42:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-42-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Run scan (writes reports only)
        run: php ./tools/batch-42-scan.php

      - name: Commit & push branch
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m "batch42(mapping): repo-wide FluentPDO usage report (no code changes)" || true
          git push --set-upstream origin "$UNIQUE_BRANCH"

      - name: Create PR via API
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/${GH_REPO}/pulls"
          DATA=$(jq -n \
            --arg title "Batch 42: FluentPDO mapping (reports only)" \
            --arg head  "$UNIQUE_BRANCH" \
            --arg base  "$BASE_BRANCH" \
            --arg body  "Full repo scan of FluentPDO usage. Reports written to tools/reports/. No code changes." \
            '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true, draft:false}')
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
               "${API}" -d "${DATA}" | jq .
