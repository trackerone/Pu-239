name: Batch 37.2 – FluentPDO Scan with Logging

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run refactor scanner
        run: php tools/fluentpdo-scan-verbose.php > refactor-log.txt

      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluentpdo-scan-verbose
          path: refactor-log.txt
