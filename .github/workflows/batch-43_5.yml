name: Batch 43.5 - Admin audit (reports only)

on:
  workflow_dispatch:

jobs:
  run-batch-43_5:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-43_5-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run admin audit (reports only)
        run: php ./tools/batch-43_5-admin-audit.php

      - name: Commit & push branch
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m 'batch43.5: admin/ audit — report $this->db use, missing db init, broken fragments, mysqli leftovers, strict_types order' || true
          git push --set-upstream origin "$UNIQUE_BRANCH"

      - name: Create PR via API
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/${GH_REPO}/pulls"
          DATA=$(jq -n \
            --arg title 'Batch 43.5: Admin audit (reports only)' \
            --arg head  "$UNIQUE_BRANCH" \
            --arg base  "$BASE_BRANCH" \
            --arg body  'Scans admin/*.php and reports issues: $this->db usage, missing $db init, broken $db->run fragments, mysqli/sql_query leftovers, strict_types not first, bare die/exit, TODO(batch41), and bad $site_config tail. Outputs tools/reports/batch43_5-admin-audit.ndjson + batch43_5-summary.txt. No code changes.' \
            '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true, draft:false}')
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
               "${API}" -d "${DATA}" | jq .
