name: Batch 43.7C - Admin parse error report

on:
  workflow_dispatch:

jobs:
  report-parse-errors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-43_7C-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Generate admin parse error report
        run: php ./tools/report-parse-errors.php

      - name: Commit & push report
        run: |
          set -euxo pipefail
          git config user.name  "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add tools/reports/batch43_7C-parse-errors.txt || true
          git commit -m "batch43.7C: admin parse error report" || true
          git push --set-upstream origin "$UNIQUE_BRANCH"

      - name: Create PR
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/${GH_REPO}/pulls"
          DATA=$(jq -n \
            --arg title "Batch 43.7C: Admin parse error report" \
            --arg head  "$UNIQUE_BRANCH" \
            --arg base  "$BASE_BRANCH" \
            --arg body  "Report-only. Scans admin/*.php with php -l and writes tools/reports/batch43_7C-parse-errors.txt. No auto-fixes performed." \
            '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true, draft:false}')
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}" -d "${DATA}" | jq .
