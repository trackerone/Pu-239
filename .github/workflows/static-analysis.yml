name: Static Analysis (CI-only)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pcntl, pdo_mysql, bcmath
          coverage: none
          tools: composer:v2, phpstan

      - name: Install Composer dependencies (prod only)
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Install QA tools globally (no local needed)
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true || true
          composer global require laravel/pint:^1.17 nunomaduro/larastan:^2.9 --no-interaction --no-progress
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Prepare app key and env
        run: |
          cp -n .env.example .env || true
          php artisan key:generate || true

      - name: Run Laravel Pint (code style)
        run: pint --test

      - name: Run PHPStan (level max)
        run: phpstan analyse --configuration=phpstan.neon --memory-limit=1G

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-artifacts
          path: |
            storage/logs
            phpstan-baseline.neon
