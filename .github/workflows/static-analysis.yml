name: Static Analysis (soft)

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, phpstan
          coverage: none

      - name: Composer (no-dev, ignore platform)
        run: |
          composer install --no-interaction --no-progress --prefer-dist             --no-dev --no-scripts --no-plugins --ignore-platform-reqs

      - name: Install QA tools globally
        run: |
          composer global require laravel/pint:^1.17 nunomaduro/larastan:^2.9 --no-interaction --no-progress
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Pint (non-blocking)
        continue-on-error: true
        run: pint --test

      - name: PHPStan (non-blocking)
        continue-on-error: true
        run: phpstan analyse --configuration=phpstan.neon --memory-limit=1G

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-artifacts
          path: storage/logs
