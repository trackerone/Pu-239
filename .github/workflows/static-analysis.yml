name: Static Analysis (PHP 8.3 + PHPStan)

on:
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - '!vendor/**'
      - '!node_modules/**'
      - '!_quarantine/**'
  push:
    branches: [ main ]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - '!vendor/**'
      - '!node_modules/**'
      - '!_quarantine/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP lint (parallel)
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./node_modules/*" \
            -not -path "./_quarantine/*" \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: Ensure PHPStan (CI fallback)
        run: |
          if [ ! -x "vendor/bin/phpstan" ]; then
            composer require --dev phpstan/phpstan:^1 --no-interaction --no-progress
          fi

      - name: PHPStan analyse
        run: vendor/bin/phpstan analyse --no-progress
