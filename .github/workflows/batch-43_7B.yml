name: Batch 43.7B - Admin mysqli→ExtendedPdo rewrite

on:
  workflow_dispatch:

jobs:
  run-batch-43_7B:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-43_7B-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }

      - name: Run admin autofix (43.7B)
        run: php ./tools/batch-43_7B-admin-autofix.php
  
      - name: Lint changed admin PHP files
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only | grep '^admin/.*\.php$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed admin PHP files to lint."
            exit 0
          fi
          echo "$CHANGED" | while read -r f; do php -l "$f" || true; done | tee /tmp/php_lint.log
          if grep -q "Errors parsing" /tmp/php_lint.log; then
            echo "PHP lint errors found."
            exit 1
          fi

      - name: Commit & push branch
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m "batch43.7B: admin/ mysqli/sql_query → ExtendedPdo; place \$db after use + runtime_safe; comment ORIGINAL broken lines" || true
          git push --set-upstream origin "$UNIQUE_BRANCH"

      - name: Create PR
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/${GH_REPO}/pulls"
          DATA=$(jq -n \
            --arg title "Batch 43.7B: Admin mysqli→ExtendedPdo rewrite" \
            --arg head  "$UNIQUE_BRANCH" \
            --arg base  "$BASE_BRANCH" \
            --arg body  "Converts admin/*.php to ExtendedPdo: insert \$db after use+runtime_safe, replace mysqli/sql_query with fetchAll/fetchRow/fetchValue/perform, preserve LIMIT concat, map mysqli_insert_id, and comment ORIGINAL broken \$db->run('); lines. See tools/reports/batch43_7-summary.txt." \
            '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true, draft:false}')
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
               "${API}" -d "${DATA}" | jq .
