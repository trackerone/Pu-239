name: auto-merge-when-green

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, edited, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR has 'automerge' label
        id: labels
        uses: actions-ecosystem/action-has-labels@v1
        with:
          labels: automerge
        continue-on-error: true

      - name: Exit if no automerge label
        if: steps.labels.outputs.has != 'true'
        run: echo "No automerge label → skipping."

      - name: Auto-merge when ready
        if: steps.labels.outputs.has == 'true'
        uses: peter-evans/auto-merge@v3
        with:
          merge-method: squash
          commit-message: pull-request-title
          delete-branch: true
          required-labels: automerge
          blocking-labels: do-not-merge
          allow-skip-ci: true
