name: Batch 43.7 - Admin full rewrite (no TODOs)

on:
  workflow_dispatch:

jobs:
  run-batch-43_7:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-43_7-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Force strict_types first in all admin/*.php
        run: php ./tools/fix-strict-first.php

      - name: Apply admin full rewrite (no TODOs)
        run: php ./tools/batch-43_7-admin-rewrite.php

      - name: Lint changed admin PHP files
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only | grep '^admin/.*\.php$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed admin PHP files to lint."
            exit 0
          fi
          echo "$CHANGED" | while read -r f; do
            php -l "$f" || true
          done | tee /tmp/php_lint.log
          if grep -q "Errors parsing" /tmp/php_lint.log; then
            echo "PHP lint errors found."
            exit 1
          fi

      - name: Commit & push branch
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m 'batch43.7: admin/ rewrite — strict_types truly first (single PHP block), $db init after use + runtime_safe, mysqli/sql_query → ExtendedPdo, ORIGINAL comments for broken lines' || true
          git push --set-upstream origin "$UNIQUE_BRANCH"

      - name: Create PR via API
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/${GH_REPO}/pulls"
          DATA=$(jq -n \
            --arg title 'Batch 43.7: Admin full rewrite (no TODOs)' \
            --arg head  "$UNIQUE_BRANCH" \
            --arg base  "$BASE_BRANCH" \
            --arg body  'Two-pass fix: (1) flatten PHP blocks and force declare(strict_types=1) as the first statement across admin/*.php; (2) convert mysqli/sql_query to ExtendedPdo, insert $db after use + runtime_safe, keep LIMIT concat, map mysqli_insert_id, and comment ORIGINAL broken lines. All comments in English. See tools/reports/batch43_7-summary.txt.' \
            '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true, draft:false}')
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
               "${API}" -d "${DATA}" | jq .
