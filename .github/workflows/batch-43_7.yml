name: Batch 43.7 - Admin full rewrite (no TODOs)

on:
  workflow_dispatch:

jobs:
  run-batch-43_7:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-43_7-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Apply admin full rewrite (no TODOs)
        run: php ./tools/batch-43_7-admin-rewrite.php

      - name: Lint changed admin PHP files
        run: |
          set -euxo pipefail
          git diff --name-only | grep '^admin/.*\.php$' || exit 0
          git diff --name-only | grep '^admin/.*\.php$' | xargs -I{} php -l {}

      - name: Commit & push branch
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m 'batch43.7: admin/ full rewrite — swap mysqli/sql_query to ExtendedPdo, add $db, strict_types, keep ORIGINAL comments where ambiguous' || true
          git push --set-upstream origin "$UNIQUE_BRANCH"

      - name: Create PR via API
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/${GH_REPO}/pulls"
          DATA=$(jq -n \
            --arg title 'Batch 43.7: Admin full rewrite (no TODOs)' \
            --arg head  "$UNIQUE_BRANCH" \
            --arg base  "$BASE_BRANCH" \
            --arg body  'Deterministic conversion in admin/*.php: enforce strict_types first; ensure $db = container->get(Database::class); replace $this->db/$this->cache with $db/$cache; convert sql_query/mysqli_* to $db->fetchAll/fetchRow/fetchValue/perform; preserve pager LIMIT concatenation; replace mysqli_num_rows with count(); map mysqli_insert_id to $db->lastInsertId(); keep ORIGINAL commented lines where SQL was broken/unknown (no TODOs). See tools/reports/batch43_7-summary.txt.' \
            '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true, draft:false}')
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
               "${API}" -d "${DATA}" | jq .
