name: Batch SANITY — Create file & open PR
on: { workflow_dispatch: {} }

jobs:
  sanity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-sanity-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create a heartbeat file
        run: |
          mkdir -p tools/reports
          echo "Sanity $(date -u +%FT%TZ)" > tools/reports/HEARTBEAT.txt
      - name: Commit & push to new branch
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m "batch(sanity): add HEARTBEAT.txt" || echo "Nothing to commit"
          git push --set-upstream origin "$UNIQUE_BRANCH" || echo "Nothing to push"
      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.UNIQUE_BRANCH }}
          title: "Batch SANITY: Verify PR pipeline"
          body: "Adds tools/reports/HEARTBEAT.txt to prove Actions can push & open PR."
          labels: batch, automated, sanity
          delete-branch: true
