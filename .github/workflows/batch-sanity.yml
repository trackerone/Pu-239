name: Batch SANITY — Create file & open PR (API)

on:
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UNIQUE_BRANCH: batch-sanity-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create heartbeat file
        run: |
          mkdir -p tools/reports
          echo "Sanity $(date -u +%FT%TZ)" > tools/reports/HEARTBEAT.txt

      - name: Commit & push branch
        run: |
          set -euxo pipefail
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          git checkout -B "$UNIQUE_BRANCH" "origin/$BASE_BRANCH"
          git add -A
          git commit -m "batch(sanity): add HEARTBEAT.txt" || true
          git push --set-upstream origin "$UNIQUE_BRANCH"

      # 🔧 Opret PR direkte via GitHub REST API
      - name: Create PR via API
        run: |
          set -euxo pipefail
          API="https://api.github.com/repos/${GH_REPO}/pulls"
          DATA=$(jq -n \
            --arg title "Batch SANITY: Verify PR pipeline" \
            --arg head  "$UNIQUE_BRANCH" \
            --arg base  "$BASE_BRANCH" \
            --arg body  "Adds tools/reports/HEARTBEAT.txt to prove Actions can push & open PR." \
            '{title:$title, head:$head, base:$base, body:$body, maintainer_can_modify:true, draft:false}')
          # Prøv at oprette PR. Hvis den findes allerede, print link og fortsæt.
          RESP=$(curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                  "${API}" -d "${DATA}" || true)
          echo "${RESP}" | jq .
          URL=$(echo "${RESP}" | jq -r '.html_url // empty')
          if [ -z "$URL" ]; then
            # Måske eksisterer PR'en allerede — forsøg at finde den
            Q="https://api.github.com/repos/${GH_REPO}/pulls?head=${{ github.repository_owner }}:${UNIQUE_BRANCH}&base=${BASE_BRANCH}&state=open"
            RESP2=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$Q")
            echo "${RESP2}" | jq .
          fi
