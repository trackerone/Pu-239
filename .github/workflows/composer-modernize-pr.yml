name: Composer Modernize PR
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Upgrade scope (patch|minor|major|all)'
        required: true
        default: 'minor'

jobs:
  modernize:
    runs-on: ubuntu-latest
    env:
      COMPOSER_NO_INTERACTION: 1
      COMPOSER_ALLOW_SUPERUSER: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3 + extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: >
            bz2, ctype, curl, dom, exif, fileinfo, gd, gettext,
            iconv, imagick, intl, json, libxml, mbstring, mysqli,
            pcntl, pdo, posix, readline, simplexml, sockets, xml,
            opcache, zip, zlib

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Install
        run: composer install --prefer-dist --no-progress

      - name: Decide update args
        id: plan
        run: |
          case "${{ github.event.inputs.scope }}" in
            patch) echo "ARGS=--with-all-dependencies --prefer-stable" >> $GITHUB_OUTPUT ;;
            minor) echo "ARGS=--with-all-dependencies --prefer-stable" >> $GITHUB_OUTPUT ;;
            major) echo "ARGS=" >> $GITHUB_OUTPUT ;;
            all)   echo "ARGS=" >> $GITHUB_OUTPUT ;;
            *)     echo "ARGS=--with-all-dependencies --prefer-stable" >> $GITHUB_OUTPUT ;;
          esac

      - name: Update dependencies
        run: composer update ${{ steps.plan.outputs.ARGS }} --no-progress

      - name: Run basic checks (optional)
        run: |
          composer dump-autoload -a
          php -v

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: composer/modernize-${{ github.event.inputs.scope }}
          title: "chore: Composer ${{ github.event.inputs.scope }} upgrades"
          body: |
            Automated Composer update (**scope**=${{ github.event.inputs.scope }}).
            Review changelogs before merging.
          commit-message: "chore(composer): ${{ github.event.inputs.scope }} upgrades"
          delete-branch: true
