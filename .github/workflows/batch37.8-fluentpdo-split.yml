name: Batch 37.8 – FluentPDO Split Refactor (Safe + TODO)

on:
  workflow_dispatch:

jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run safe refactor (simple patterns)
        run: php tools/fluentpdo-refactor-safe.php > refactor-safe-log.txt

      - name: Upload safe log
        uses: actions/upload-artifact@v4
        with:
          name: fluentpdo-safe-log
          path: refactor-safe-log.txt

      - name: Create PR for safe refactor
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: auto-refactor FluentPDO (safe patterns, Batch 37.8)"
          title: "Batch 37.8 – Auto-refactor (safe queries)"
          body: |
            This PR replaces simple FluentPDO calls with Aura.Sql equivalents.
            It preserves variables like $values, $set and WHERE params.
          branch: batches/batch37.8-refactor
          delete-branch: true

      - name: Run TODO refactor (complex patterns)
        run: php tools/fluentpdo-refactor-todo.php > refactor-todo-log.txt

      - name: Upload TODO log
        uses: actions/upload-artifact@v4
        with:
          name: fluentpdo-todo-log
          path: refactor-todo-log.txt

      - name: Create PR for TODO refactor
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: mark complex FluentPDO queries with TODO (Batch 37.8)"
          title: "Batch 37.8 – TODO queries (manual review)"
          body: |
            This PR marks FluentPDO queries that were too complex to auto-refactor.
            Review each TODO and rewrite manually with proper SQL.
          branch: batches/batch37.8-todo
          delete-branch: true
