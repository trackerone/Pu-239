name: security-harden-sprint

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Files per batch"
        required: true
        default: "12"
      max_prs_per_run:
        description: "Max PRs this run"
        required: true
        default: "8"
      mode:
        description: "turbo (multi-PR) or cautious (single-PR)"
        required: true
        default: "turbo"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: security-harden-sprint
  cancel-in-progress: false

jobs:
  sprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install jq & html-xml-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y jq html-xml-utils

      - name: Ensure tools dir
        run: mkdir -p tools

      # ========== DISCOVERY (ULTRA BROAD) ==========
      - name: Discover candidates (server-side + forms + fallback)
        run: |
          set -euo pipefail

          # 0) Saml alle potentielle filer
          find . -type f \( -name "*.php" -o -name "*.phtml" -o -name "*.inc" -o -name "*.tpl" -o -name "*.html" \) \
            -not -path "./vendor/*" \
            -not -path "./.git/*" \
            -not -path "./_quarantine/*" \
            -not -path "./node_modules/*" \
            -not -path "./storage/*" \
            -not -path "./cache/*" \
            -not -path "./public/assets/*" \
            > /tmp/all_candidates.txt

          : > tools/web_post_candidates.txt
          : > /tmp/server_hits.txt
          : > /tmp/form_hits.txt
          : > /tmp/fallback_hits.txt

          # 1) Server-side patterns (klassisk + wrappers)
          #   - POST i superglobals, filter_input
          #   - REQUEST_METHOD == 'POST' (uanset case, ==/===)
          #   - Framework-agtige wrappers: $request->isPost(), Request::isPost(), Input::post(), $request->post(…
          SERVER_RX='\$_POST[[:space:]\[\],]|filter_input\(INPUT_POST|\\\$_SERVER\[['"'"']REQUEST_METHOD['"'"']\][[:space:]]*[=!]=[=]?[[:space:]]*([Pp][Oo][Ss][Tt])|[Rr]equest::isPost\(|\$request->isPost\(|Input::post\(|\$request->post\('
          while IFS= read -r f; do
            if grep -Iq . "$f" && grep -qE "$SERVER_RX" "$f"; then
              echo "$f" >> /tmp/server_hits.txt
            fi
          done < /tmp/all_candidates.txt

          # 2) Form-source: <form method="post" action="...">
          #    - Selv-postende (action tom/ikke sat) → tag filen selv
          #    - action="relative.php" → prøv at mappe til eksisterende fil i repo
          #    - action uden .php (fx /admin/save) hopper vi over (kan være router)
          FORM_FILE_EXTS='php|phtml|inc|tpl'
          while IFS= read -r f; do
            # Læs kun tekstfiler
            grep -Iq . "$f" || continue
            # Find <form ... method=post ...>
            if grep -qiE '<form[^>]*method=[\"\x27]?post[\"\x27]?' "$f"; then
              # Ekstraher action-attributter (simpel, men effektiv)
              ACTIONS=$(grep -oiE '<form[^>]*method=[\"\x27]?post[\"\x27]?[^>]*>' "$f" | grep -oiE 'action=[\"\x27][^\"\x27]+' | cut -d'=' -f2 | tr -d '"'\'' || true)
              if [ -z "$ACTIONS" ]; then
                # ingen action -> selv-postende
                echo "$f" >> /tmp/form_hits.txt
              else
                while IFS= read -r a; do
                  # hop over anchors og absolutte URLs
                  if echo "$a" | grep -qE '^(#|https?://)'; then
                    continue
                  fi
                  # tom action => selv-post
                  if [ -z "$a" ]; then
                    echo "$f" >> /tmp/form_hits.txt
                    continue
                  fi
                  # kun simple relative stier, og kun hvis de ligner en php-fil
                  if echo "$a" | grep -qiE "\.($FORM_FILE_EXTS)(\?.*)?$"; then
                    # normaliser './' og fjern querystring
                    a_clean=$(echo "$a" | sed -E 's/^\.\///; s/\?.*$//')
                    # prøv direkte sti
                    if [ -f "$a_clean" ]; then
                      echo "$a_clean" >> /tmp/form_hits.txt
                      continue
                    fi
                    # prøv relativ til filens mappe
                    base_dir=$(dirname "$f")
                    if [ -f "$base_dir/$a_clean" ]; then
                      echo "$base_dir/$a_clean" >> /tmp/form_hits.txt
                      continue
                    fi
                    # prøv uden leading slash
                    a_noslash=$(echo "$a_clean" | sed -E 's@^/@@')
                    if [ -f "$a_noslash" ]; then
                      echo "$a_noslash" >> /tmp/form_hits.txt
                    fi
                  else
                    # action uden .php → kan være router; tag skabelonsfilen selv som kandidat
                    echo "$f" >> /tmp/form_hits.txt
                  fi
                done <<< "$ACTIONS"
              fi
            fi
          done < /tmp/all_candidates.txt

          # 3) Fallback-hints: filer med $_REQUEST[...] (kan være blandede handlers)
          while IFS= read -r f; do
            if grep -Iq . "$f" && grep -qE '\$_REQUEST\[['"'"'"][^"'"'"']+['"'"'"]\]' "$f"; then
              echo "$f" >> /tmp/fallback_hits.txt
            fi
          done < /tmp/all_candidates.txt

          # Union og deduplikér
          cat /tmp/server_hits.txt /tmp/form_hits.txt /tmp/fallback_hits.txt | sed '/^$/d' | sort -u > tools/web_post_candidates.txt || true

          echo "---- Discovery counts ----"
          echo "Server-side hits : $(wc -l < /tmp/server_hits.txt || echo 0)"
          echo "Form-source hits : $(wc -l < /tmp/form_hits.txt || echo 0)"
          echo "Fallback (REQUEST): $(wc -l < /tmp/fallback_hits.txt || echo 0)"
          echo "TOTAL candidates  : $(wc -l < tools/web_post_candidates.txt || echo 0)"

      - name: Show candidates (first 80) & guard if none
        run: |
          set -euo pipefail
          COUNT=$(wc -l < tools/web_post_candidates.txt || echo 0)
          echo "Candidates count: $COUNT"
          echo "---- Candidates (max 80) ----"
          head -n 80 tools/web_post_candidates.txt || true
          if [ ! -s tools/web_post_candidates.txt ]; then
            echo "::error::Still no candidates. If you use a central router/controller, tell me its path so I can tune the detector."
            exit 1
          fi

      # ========== REFACTOR SCRIPT ==========
      - name: Write tools/security-auto-harden.php
        run: |
          cat > tools/security-auto-harden.php <<'PHP'
          <?php
          declare(strict_types=1);

          /**
           * Global web hardening (batch)
           * - Input: tools/web_post_candidates.txt
           * - Adds strict header + bootstrap_web.php
           * - CSRF verify for POST (supports $_POST, filter_input, $_SERVER['REQUEST_METHOD'], $request->isPost())
           * - Escaping via $s() for obvious user-controlled outputs
           * - JSON harden (header + JSON_THROW_ON_ERROR)
           * - Report CSV + lint log
           */

          $opt = getopt("", ["batch_size::"]);
          $batch = max(1, (int)($opt["batch_size"] ?? 12));
          $list  = __DIR__ . "/web_post_candidates.txt";
          if (!is_file($list)) { fwrite(STDERR, "Missing candidates list\n"); exit(2); }
          $cands = array_values(array_filter(array_map('trim', file($list)), 'strlen'));

          $report = __DIR__ . '/security_harden_report.csv';
          if (!file_exists($report)) file_put_contents($report, "file,csrf_enforced,csrf_todo,escaped_outputs,json_hardened,notes\n");
          $lintLog = __DIR__ . '/security_harden_lint.txt';
          if (!file_exists($lintLog)) file_put_contents($lintLog, "");

          $tokenRx = '/\$_POST\[[\'"](?:csrf|token|_token|csrf_token|csrfToken|formToken|_csrf|securitytoken)[\'"]\]/i';

          $changed = [];
          $done = 0;

          foreach ($cands as $path) {
              if ($done >= $batch) break;
              if (!is_file($path)) continue;

              $code = file_get_contents($path);
              $orig = $code;
              $notes = [];
              $csrfEnforced = false; $csrfTodo = false; $escapedCount = 0; $jsonHardened = false;

              $isPhp = (bool)preg_match('/<\?php/i', $code) || preg_match('/\.php$|\.phtml$|\.inc$|\.tpl$/i', $path);
              if (!$isPhp) continue; // sikkert valg

              // 1) Strict header + bootstrap
              if (strpos($code, 'declare(strict_types=1);') === false || strpos($code, 'bootstrap_web.php') === false) {
                  if (preg_match('/^\s*<\?php/s', $code)) {
                      $hdr = "<?php\n".
                             "declare(strict_types=1);\n".
                             "require_once dirname(__DIR__) . '/bootstrap_web.php';\n";
                      $code = preg_replace('/^\s*<\?php\s*/', $hdr, $code, 1);
                      $notes[] = 'header_fix';
                  } else {
                      $code = "<?php\ndeclare(strict_types=1);\nrequire_once dirname(__DIR__) . '/bootstrap_web.php';\n?>\n" . $code;
                      $notes[] = 'header_prepend';
                  }
              }

              // 2) POST detection (klassisk + wrappers)
              $isPost = (bool) preg_match('/\$_POST[ \[\],]|filter_input\(INPUT_POST|\\$_SERVER\[[\'"]REQUEST_METHOD[\'"]\]\s*[=!]=[=]?\s*[\'"]POST[\'"]|Request::isPost\(|\$request->isPost\(|Input::post\(|\$request->post\(/i', $code);

              if ($isPost) {
                  if (strpos($code, 'PU239\\Support\\Csrf') === false) {
                      $code = preg_replace('/(<\?php\s+declare\(strict_types=1\);\s+require_once[^\n]*bootstrap_web\.php\'\);\s*)/s',
                                           "$1use PU239\\Support\\Csrf;\n",
                                           $code, 1, $u);
                      if (!$u) $code = preg_replace('/<\?php\s*/', "<?php\nuse PU239\\Support\\Csrf;\n", $code, 1);
                  }

                  if (strpos($code, 'Csrf::verify(') === false) {
                      $hasToken = (bool) preg_match($tokenRx, $code);
                      $guard = $hasToken
                        ? "\nif (!Csrf::verify(\$_POST['csrf'] ?? (\$_POST['token'] ?? (\$_POST['_token'] ?? (\$_POST['csrf_token'] ?? (\$_POST['csrfToken'] ?? (\$_POST['formToken'] ?? (\$_POST['_csrf'] ?? (\$_POST['securitytoken'] ?? ''))))))))) {\n    http_response_code(419);\n    throw new \\RuntimeException('CSRF verification failed.');\n}\n"
                        : "\n// TODO(2025): csrf\n";

                      // Indsæt ved første POST-relaterede linje
                      $code = preg_replace(
                        '/(\$_SERVER\[[\'"]REQUEST_METHOD[\'"]\]\s*[=!]=[=]?\s*[\'"]POST[\'"].*\n|filter_input\(INPUT_POST[^\n]*\n|\$_POST[^\n]*\n|Request::isPost\([^\n]*\n|\$request->isPost\([^\n]*\n|Input::post\([^\n]*\n|\$request->post\([^\n]*\n)/',
                        "$0$guard", $code, 1, $g
                      );
                      if (!$g) {
                        $code = preg_replace('/(require_once[^\n]*bootstrap_web\.php\'\);\s*(?:use[^\n]*;\s*)*)/s', "$1$guard", $code, 1, $h);
                        $g = $h;
                      }
                      $csrfEnforced = $hasToken && (bool) $g;
                      $csrfTodo = !$hasToken && (bool) $g;
                  } else {
                      $csrfEnforced = true;
                  }
              }

              // 3) $s() helper (idempotent)
              if (strpos($code, '$s = $s ?? static fn(') === false) {
                  $code = preg_replace(
                    '/(use\s+PU239\\\\Support\\\\Csrf;\s*)/s',
                    "$1" . '$s = $s ?? static fn($v) => htmlspecialchars((string)$v, ENT_QUOTES | ENT_SUBSTITUTE, "UTF-8");' . "\n",
                    $code, 1, $ins);
                  if (!$ins) {
                      $code = preg_replace('/(require_once[^\n]*bootstrap_web\.php\'\);\s*)/s',
                        "$1" . '$s = $s ?? static fn($v) => htmlspecialchars((string)$v, ENT_QUOTES | ENT_SUBSTITUTE, "UTF-8");' . "\n",
                        $code, 1);
                  }
                  $notes[] = 's_helper';
              }

              // 4) Escape oftest farlige outputs (superglobals)
              $code = preg_replace_callback(
                '/\b(echo|print)\s+((?:\$_(?:GET|POST|REQUEST|COOKIE)\[[^\]]+\][^;]*));/i',
                function($m) use (&$escapedCount){ $escapedCount++; return $m[1].' $s('.$m[2].');'; },
                $code
              );
              $code = preg_replace_callback(
                '/\b(print|printf|sprintf)\s*\(\s*("|\')(?:[^"\'\\]*(?:\\.[^"\'\\]*)*)\2\s*,\s*((?:\$_(?:GET|POST|REQUEST|COOKIE)\[[^\)]\)|[^)])+)\)/i',
                function($m) use (&$escapedCount){ $escapedCount++; return $m[1].'('.$m[2].$m[2].', $s('.$m[3].'))'; },
                $code
              );
              $code = preg_replace_callback(
                '/<\?=\s*((?:\$_(?:GET|POST|REQUEST|COOKIE)\[[^\>]+))\s*\?>/i',
                function($m) use (&$escapedCount){ $escapedCount++; return '<?= $s('.$m[1].') ?>'; },
                $code
              );
              $code = preg_replace('/\$s\(\s*\$s\(/', '$s(', $code);

              // 5) JSON hardening
              if (preg_match('/json_encode\s*\(/i', $code) || preg_match('/header\s*\(\s*[\'"]Content-Type:\s*application\/json/i', $code)) {
                  if (strpos($code, "Content-Type: application/json") === false) {
                      $code = "header('Content-Type: application/json; charset=utf-8');\n".$code;
                  }
                  $code = preg_replace('/(?:echo\s*)?json_encode\s*\(([^;]+)\);/i', 'echo json_encode($1, JSON_THROW_ON_ERROR);', $code, -1, $cj);
                  if ($cj) $jsonHardened = true;
              }

              if ($code !== $orig) {
                  file_put_contents($path, $code);
                  $changed[] = $path;
                  $done++;
              }

              // Lint + report
              $out=[]; $rc=0; exec('php -l '.escapeshellarg($path).' 2>&1', $out, $rc);
              file_put_contents($lintLog, $path." :: ".($rc===0?'OK':implode(' ',$out)).PHP_EOL, FILE_APPEND);
              file_put_contents($report, sprintf("%s,%s,%s,%d,%s,%s\n",
                  $path,
                  $csrfEnforced?'true':'false',
                  $csrfTodo?'true':'false',
                  $escapedCount,
                  $jsonHardened?'true':'false',
                  $notes ? implode('|',$notes) : ''
              ), FILE_APPEND);
          }

          file_put_contents(__DIR__ . '/_security_changed.txt', implode(PHP_EOL, $changed));
          echo "Changed files: ".count($changed).PHP_EOL;
          PHP

      # ========== SPRINT (multi-batch PRs) ==========
      - name: Sprint loop → create draft PRs (+ label automerge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_MODE: ${{ github.event.inputs.mode }}
          BATCH: ${{ github.event.inputs.batch_size }}
          MAX_PRS: ${{ github.event.inputs.max_prs_per_run }}
        run: |
          set -euo pipefail

          sanitize() {
            git ls-files -m -o --exclude-standard | while read -r f; do
              if file "$f" | grep -qiE 'text'; then
                sed -i -E 's/^>{6}([[:space:]].*)?$/>>>>>>> \1/' "$f"
                sed -i -E 's/^<{6}([[:space:]].*)?$/<<<<<<< \1/' "$f"
              fi
            done
            if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' -- . | grep -vE '^\.github/|^vendor/'; then
              echo "ERROR: Real conflict markers present. Aborting." >&2
              exit 1
            fi
          }

          open_pr () {
            local branch="$1" title="$2" body="$3"
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls" \
              -d "$(jq -n --arg head "$branch" --arg base "main" --arg title "$title" --arg body "$body" \
                    '{head:$head, base:$base, title:$title, body:$body, draft:true, maintainer_can_modify:true}')" \
              | jq -r '.number'
          }

          label_pr () {
            local number="$1"
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${number}/labels" \
              -d '{"labels":["automerge","security-harden"]}' >/dev/null
          }

          OPENED=0; ITER=0
          while : ; do
            ITER=$((ITER+1))
            echo "::group::Batch #$ITER"
            php tools/security-auto-harden.php --batch_size="${BATCH}" || true

            echo "---- Git status (after batch) ----"
            git status --porcelain || true
            if [ -s tools/_security_changed.txt ]; then
              CHANGED_COUNT=$(wc -l < tools/_security_changed.txt | tr -d ' ')
              echo "Changed files ($CHANGED_COUNT):"
              cat tools/_security_changed.txt
            else
              CHANGED_COUNT=0
              echo "::warning::No changes produced by this batch."
            fi

            if [ "$CHANGED_COUNT" -eq 0 ]; then
              echo "No further changes. Done."; echo "::endgroup::"; break
            fi

            sanitize

            BR="security/harden-global-batch-${ITER}-$(date +%s)"
            git config user.name "pu239-bot"
            git config user.email "pu239-bot@users.noreply.github.com"
            git checkout -b "${BR}"
            git add -A
            git commit -m "feat: global CSRF + escaping (batch #${ITER}, size=${BATCH})"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" "${BR}"

            BODY=$(printf '%s\n\n%s\n' \
              "Automated global hardening (CSRF + escaping) across the codebase." \
              "Changed files:")
            BODY="$BODY"$'\n''```'$'\n'"$(cat tools/_security_changed.txt)"$'\n''```'

            PR_NUM=$(open_pr "${BR}" "feat: global CSRF + escaping (batch #${ITER})" "${BODY}")
            echo "Opened PR #$PR_NUM"
            label_pr "$PR_NUM"
            echo "::endgroup::"

            [ "${RUN_MODE}" = "cautious" ] && { echo "Cautious mode → stop."; break; }
            [ "${OPENED}" -ge "${MAX_PRS}" ] && { echo "Reached max_prs_per_run=${MAX_PRS} → stop."; break; }
            OPENED=$((OPENED+1))

            git checkout -q -
            git reset --hard HEAD
          done

      # ========== SUM + ARTIFACTS ==========
      - name: Summarize CSRF TODOs
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f tools/security_harden_report.csv ]; then
            echo "No report found."; exit 0
          fi
          TOTAL=$(awk 'NR>1' tools/security_harden_report.csv | wc -l | tr -d ' ')
          ENFORCED=$(awk -F',' 'NR>1 && $2=="true"{c++} END{print c+0}' tools/security_harden_report.csv)
          TODO=$(awk -F',' 'NR>1 && $3=="true"{c++} END{print c+0}' tools/security_harden_report.csv)
          echo "Total files touched: $TOTAL"
          echo "CSRF enforced: $ENFORCED"
          echo "CSRF TODO: $TODO"
          echo "Files with CSRF TODO (top 50):"
          awk -F',' 'NR>1 && $3=="true"{print $1}' tools/security_harden_report.csv | head -n 50
          {
            echo "## Security harden summary"
            echo ""
            echo "- Total files in report: $TOTAL"
            echo "- CSRF enforced: **$ENFORCED**"
            echo "- CSRF TODO: **$TODO**"
            echo ""
            echo "### First 50 TODO files"
            echo
