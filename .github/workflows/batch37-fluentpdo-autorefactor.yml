name: Batch 37.3 – FluentPDO Auto-refactor

on:
  workflow_dispatch:

jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run auto-refactor
        run: php tools/fluentpdo-autorefactor.php > refactor-log.txt

      - name: Upload refactor log
        uses: actions/upload-artifact@v4
        with:
          name: fluentpdo-refactor-log
          path: refactor-log.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: auto-refactor FluentPDO -> Aura.Sql"
          title: "Batch 37.3 – Auto-refactor FluentPDO"
          body: |
            This PR was generated by Batch 37.3.
            It replaces common FluentPDO calls with Aura.Sql skeletons.
            Check TODOs for manual query details.
          branch: batches/batch37-fluentpdo-autorefactor
          delete-branch: true
