name: PHP 8.3 Blockers Check (Soft)

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan composer.lock for known PHP 7.x only packages
        run: php tools/scan_php83_blockers.php > php83-blockers-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: php83-blockers-report
          path: php83-blockers-report.txt

      - name: Print summary (non-blocking)
        shell: bash
        run: |
          echo "---- PHP 8.3 Blockers (soft) ----"
          cat php83-blockers-report.txt || true
