name: php-ci

on:
  pull_request:
    paths:
      - "**.php"
      - ".github/workflows/php-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax check (all PHP files)
        run: |
          set -e
          git ls-files '*.php' | while read -r f; do
            php -l "$f"
          done
