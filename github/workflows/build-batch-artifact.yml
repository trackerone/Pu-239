name: Build Batch Artifact

on:
  workflow_dispatch:
    inputs:
      batch_name:
        description: "Name of the batch (e.g., batch33_php83-remediation)"
        required: true
        default: "batch_artifact"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP from repo
        run: |
          mkdir -p artifacts
          zip -r artifacts/${{ github.event.inputs.batch_name }}.zip . \
            -x "*.git*" \
            -x "vendor/*" \
            -x "node_modules/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.batch_name }}
          path: artifacts/${{ github.event.inputs.batch_name }}.zip
